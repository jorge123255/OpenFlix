; OpenFlix Comskip Configuration
; Tuned for US cable TV (AMC, TNT, TBS, etc.)

[Main Settings]
detect_method=127           ; all methods: black frames + silence + logo + aspect + scene change + uniform + content
validate_silence=1
validate_uniform=1
validate_brightness=1

[Tuning]
max_avg_brightness=20
max_brightness=60
test_brightness=40
max_volume=500
non_uniformity=500
; Cable TV often uses loud commercials — lower threshold catches more breaks
volume_ratio=2.0

[Logo Detection]
logo_threshold=0.75
logo_filter=0
; Number of frames to check for logo presence
logo_extraction_limit=3500

[Output]
output_edl=1
output_txt=0
output_vdr=0
output_ffmeta=0
output_chapters=0

[Scoring]
; Minimum show segment between commercial breaks (seconds)
; Lower than default — cable shows have shorter acts
min_show_segment_length=180
; Cable commercial breaks can run up to 6 minutes
max_commercial_size=360
; No real commercial is shorter than 30 seconds
min_commercial_size=30
; Merge breaks that are close together (seconds)
; Prevents splitting a single commercial block into many tiny segments
max_commercial_gap=120

[Padding]
; Trim 2 seconds from start of each detected break (avoids cutting into show)
; and add 1 second buffer at end (catches the last frame before show resumes)
padding=2
