name: OpenFlixKMP
options:
  bundleIdPrefix: com.openflix
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_TEAM: 345TZ8AAP7
    CODE_SIGN_STYLE: Automatic

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        type: group
    resources:
      - path: iosApp/splash_video.mp4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openflix.kmp
        INFOPLIST_FILE: iosApp/Info.plist
        DEVELOPMENT_TEAM: 345TZ8AAP7
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        OTHER_LDFLAGS:
          - "-framework"
          - "ComposeApp"
      configs:
        Debug:
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
            - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework"
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
            - "$(SRCROOT)/../composeApp/build/bin/iosArm64/debugFramework"
        Release:
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
            - "$(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/releaseFramework"
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
            - "$(SRCROOT)/../composeApp/build/bin/iosArm64/releaseFramework"
    dependencies: []
    preBuildScripts:
      - name: Build Compose Framework
        script: |
          cd "$SRCROOT/.."
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
          else
            ./gradlew :composeApp:linkDebugFrameworkIosArm64
          fi
        basedOnDependencyAnalysis: false
